# GitHub Actions: publish hmi-app-base and portal-build to GHCR (docs/CLIENT-BUILD.md).
#
# Goes to .github/workflows/publish.yml in the GitHub repository that carries buildkit/
# (owner: industREAL-tech, to be created). Runs on GitHub's runners, so building these
# costs our servers nothing. GITHUB_TOKEN needs `packages: write`.
#
# The base is built on an arm64 runner, natively: its apt step runs arm64 binaries. A build
# is not bit-identical to an earlier one, so a CI build is always a NEW base number with its
# own buildkit/base/base-<n>.json (from the pushed config) -- base 1, built on our build server, is
# pushed as it is (`docker push` of the image whose ID base-1.json pins), never rebuilt.
# The build container is x86_64 for now (our Godot editor build is x86_64).
name: publish
on:
  push:
    tags: ["base-*", "build-*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  # Base 1 was built on our build server and is pinned by its image ID everywhere (base-1.json): it
  # is published from its `docker save` archive, attached to the release `base-1`, never
  # rebuilt. Run by hand: Actions -> publish -> Run workflow, job base-1.
  base-1:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == 'base-1'
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: load base-1.tar from the release and push it as it is
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          gh release download base-1 -R "$GITHUB_REPOSITORY" -p base.tar
          docker load -i base.tar
          id=$(docker image inspect hmi-app-base:1 --format '{{.Id}}')
          test "$id" = "sha256:c0a51e8db39005048f75a5f2296306e6d2a456faed0350aa35d701bfa3509b70"
          docker tag hmi-app-base:1 ghcr.io/industreal-tech/hmi-app-base:1
          docker push ghcr.io/industreal-tech/hmi-app-base:1
  base:
    if: startsWith(github.ref_name, 'base-') && github.ref_name != 'base-1'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/setup-buildx-action@v3
      - name: build and push hmi-app-base
        run: |
          n="${GITHUB_REF_NAME#base-}"; [ "$n" = "$GITHUB_REF_NAME" ] && n=1
          docker buildx build --platform linux/arm64 --provenance=false \
            -t ghcr.io/industreal-tech/hmi-app-base:$n --push buildkit/base
          docker buildx imagetools inspect ghcr.io/industreal-tech/hmi-app-base:$n
  build:
    if: startsWith(github.ref_name, 'build-') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Godot editor (tools/godot-editor), then portal-build
        run: |
          n="${GITHUB_REF_NAME#build-}"; [ "$n" = "$GITHUB_REF_NAME" ] && n=1
          docker build -t industreal/godot-editor:4.7.2 tools/godot-editor
          sh buildkit/make-build-image.sh ghcr.io/industreal-tech/portal-build:$n
          docker push ghcr.io/industreal-tech/portal-build:$n
